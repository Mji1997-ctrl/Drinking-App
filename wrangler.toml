name = "drinking-app"
main = "src/index.js"
compatibility_date = "2026-05-01"

# One Durable Object per game. SQLite backend — the only backend available
# on the Workers Free plan, and the right one here anyway.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Lets the Worker import the app's HTML as a string, so the whole thing
# deploys as a single Worker with no separate static hosting to set up.
[[rules]]
type = "Text"
globs = ["**/*.html"]
